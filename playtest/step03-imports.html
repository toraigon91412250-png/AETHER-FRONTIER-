<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AETHER FRONTIER | 20モジュール読み込み検査</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#091725;color:#e0f8ff;padding:20px clamp(12px,3vw,50px);line-height:1.5}
main{max-width:900px;margin:auto}h1{font-size:clamp(22px,4vw,32px);line-height:1.2}.sub{color:#b2ced8}
button{border:1px solid #5db5bd;background:#12465b;color:white;padding:12px 18px;border-radius:9px;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}#status{margin:14px 0;min-height:1.6em;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:18px}
.item{border:1px solid #31536a;border-radius:8px;padding:10px;min-height:58px;background:#102538}
.item strong{display:block}.item small{color:#adc4d4}.ok{border-color:#50cba9}.fail{border-color:#e27777}
a{color:#9bdffb}code{color:#aed6dc}
</style></head>
<body><main>
<h1>20作品 / 読み込みスモークテスト</h1>
<p class="sub">No.00 STEP 03 | <b>旧ゲームには一切影響しない独立テスト</b>。ファイルのES Module読み込みと<code>createAetherModule</code>公開を確認。モデルの描画・fps・衝突判定を試すページではない。</p>
<p><button id="run">20チームを順番に読み込む</button> <button id="clear">結果をクリア</button></p>
<div id="status" role="status" aria-live="polite">未実施</div>
<div id="grid" aria-label="チーム別の読み込み結果"></div>
<p><a href="../index.html">現行ゲームへ戻る</a> / <a href="../docs/STEP03_SOURCE_REPOSITORY.md">登録・検査記録</a></p>
</main><script type="module">
import {TEAM_IDS, TEAM_REGISTRY, importTeamFactory} from '../integration/team-registry.mjs';
const $=id=>document.getElementById(id), cards=new Map();
for(const id of TEAM_IDS){
 const el=document.createElement('div');el.className='item';el.dataset.team=id;
 el.innerHTML='<strong>No.'+id+'</strong><small>'+TEAM_REGISTRY[id].role+' / 未検査</small>';
 $('grid').append(el);cards.set(id,el);
}
async function run(){
 $('run').disabled=true;let ok=0,failed=0;
 for(const id of TEAM_IDS){
  const el=cards.get(id), label=el.querySelector('small');
  label.textContent='読み込み中';$('status').textContent='No.'+id+'を検査中 / '+ok+' OK, '+failed+' FAIL';
  try{
   const factory=await importTeamFactory(id);
   if(typeof factory!=='function')throw new TypeError('factory missing');
   el.className='item ok';label.textContent='OK · '+(TEAM_REGISTRY[id].legacy?'互換アダプター':'原版ES Module');ok++;
  }catch(e){el.className='item fail';label.textContent='FAIL · '+String(e?.message??e);failed++;console.error('No.'+id,e);}
 }
 $('status').textContent='完了: '+ok+'/20 OK、'+failed+' FAIL';
 window.aetherImportResult={ok,failed,total:TEAM_IDS.length};
 $('run').disabled=false;
}
$('run').addEventListener('click',run);
$('clear').addEventListener('click',()=>{window.aetherImportResult=null;$('status').textContent='未実施';for(const id of TEAM_IDS){let el=cards.get(id);el.className='item';el.querySelector('small').textContent=TEAM_REGISTRY[id].role+' / 未検査';}});
if(new URLSearchParams(location.search).has('autotest'))run();
</script></body></html>
