<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1426"><title>AETHER FRONTIER / 20チーム統合プレイテスト</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="world" aria-label="AETHER FRONTIERの3Dワールド"></canvas>
<header class="hud">
 <div class="identity"><span>AF / 00</span><div><b>AETHER FRONTIER</b><small id="region">AETHER CROWN</small></div></div>
 <div class="tools"><button id="view">TPS</button><button id="quality">軽量</button><button id="help" aria-label="操作ガイド">?</button></div>
</header>
<section class="mission" aria-label="現在の任務"><small id="chapter">01 / 05</small><b id="objective">飛行艇を起動する</b><span id="distance"></span></section>
<form id="travel" class="travel" hidden><label>探索ゲート <select id="destination"></select></label> <button type="submit">転送</button></form>
<div id="crosshair" aria-hidden="true"></div>
<div id="enemy" hidden><b id="enemyName"></b><progress id="enemyHP" max="100" value="100"></progress></div>
<div id="prompt" hidden></div><div id="notice" role="status"></div>
<div id="flight" hidden></div>
<div class="status"><span>耐久</span><progress id="health" max="100" value="100"></progress><span id="metrics"></span></div>
<div id="damage" aria-hidden="true"></div>
<section class="cover" id="cover">
 <div class="intro">
  <div class="eyebrow"><span></span> AETHER FRONTIER PROJECT / NO.00</div>
  <h1>AETHER<br>FRONTIER<span>.</span></h1>
  <p class="edition">空環航路 <i></i> 20チーム統合プレイテスト</p>
  <p class="description">都市から雲海へ。飛行艇で古代信号を追い、星環遺構の先に眠る機械竜を迎え撃つ。</p>
  <button id="start" disabled>ワールドを構築中</button>
  <p id="controls" class="controls"></p>
  <button id="reset" hidden>最初からやり直す</button>
 </div>
</section>
<script type="module" src="./main.js"></script>
</body>
</html>
