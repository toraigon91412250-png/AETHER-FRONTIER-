<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
/**
 * AETHER FRONTIER / Team No.09
 * ARK VESPER | 「宵環級」超巨大エーテル空中戦艦
 * Three.js r160, meters, +Y up, forward -Z.
 * Stateless with regard to scene/camera/renderer/controls. No external textures.
 *
 * import { createAetherModule } from './aether-no09.js';
 * const m = createAetherModule(THREE, { quality:'high' });
 * scene.add(m.root); m.update(dt, { elapsedTime: seconds });
 */
function createAetherModule(THREE, options = {}) {
  const root = new THREE.Group();
  root.name = 'AF09_ARK_VESPER';
  root.userData.moduleId = 'AF09';
  root.userData.forward = '-Z';
  root.userData.sizeMeters = { length: 392, beam: 220, height: 151 };
  const base = new THREE.Group();
  const high = new THREE.Group();
  const low = new THREE.Group();
  const moving = new THREE.Group();
  root.add(base, low, high, moving);
  const PI = Math.PI;
  const mat = {
    hull: new THREE.MeshStandardMaterial({color:0x233345, metalness:.70, roughness:.42, flatShading:true}),
    obsidian: new THREE.MeshStandardMaterial({color:0x101d2b, metalness:.66, roughness:.42}),
    armor: new THREE.MeshStandardMaterial({color:0x8c9da5, metalness:.76, roughness:.32, flatShading:true}),
    armorLight: new THREE.MeshStandardMaterial({color:0xc5ccd0, metalness:.67, roughness:.33}),
    gunmetal: new THREE.MeshStandardMaterial({color:0x364c5a, metalness:.8, roughness:.35}),
    gold: new THREE.MeshStandardMaterial({color:0xbb945f, metalness:.78, roughness:.29}),
    darkGold: new THREE.MeshStandardMaterial({color:0x665238, metalness:.68, roughness:.46}),
    blackGlass: new THREE.MeshStandardMaterial({color:0x082c43, emissive:0x083d56, emissiveIntensity:.75, metalness:.55, roughness:.15}),
    glow: new THREE.MeshBasicMaterial({color:0x4eeaff, toneMapped:false}),
    glowSoft: new THREE.MeshBasicMaterial({color:0x18a7d5, transparent:true, opacity:.6, depthWrite:false, toneMapped:false}),
    amber: new THREE.MeshBasicMaterial({color:0xffbd69, toneMapped:false}),
    violet: new THREE.MeshBasicMaterial({color:0x9a8dff, toneMapped:false}),
    flame: new THREE.MeshBasicMaterial({color:0x58eaff, transparent:true, opacity:.30, depthWrite:false, side:THREE.DoubleSide, toneMapped:false}),
    flameInner: new THREE.MeshBasicMaterial({color:0xc3feff, transparent:true, opacity:.50, depthWrite:false, side:THREE.DoubleSide, toneMapped:false}),
    hullVertex: new THREE.MeshStandardMaterial({vertexColors:true, metalness:.72, roughness:.40, flatShading:true, side:THREE.DoubleSide}),
  };
  const ownedGeometries = [];
  const ownedTextures = [];
  const G = (g) => { ownedGeometries.push(g); return g; };
  const sharedBox = G(new THREE.BoxGeometry(1,1,1));
  const sharedCylinder = G(new THREE.CylinderGeometry(.5,.5,1,12));
  const tmpO = new THREE.Object3D();
  const v3 = (x,y,z) => new THREE.Vector3(x,y,z);
  const segment = [
    [-193,1.4,12,-4],[-184,9,18,-11],[-167,19,22,-19],[-142,31,25,-26],
    [-107,44,27,-32],[-63,55,28,-37],[-14,62,28,-40],[49,63,28,-42],
    [106,55,27,-38],[143,43,25,-30],[171,32,22,-22],[187,24,16,-13]
  ];
  // Instanced box drawing batches keep the high-detail ship surprisingly inexpensive.
  class BoxBatch {
    constructor(){this.groups = new Map();}
    matrix(k,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0) {
      tmpO.position.set(x,y,z); tmpO.rotation.set(rx,ry,rz);
      tmpO.scale.set(sx,sy,sz); tmpO.updateMatrix();
      if (!this.groups.has(k)) this.groups.set(k, []);
      this.groups.get(k).push(tmpO.matrix.clone());
    }
    between(k,a,b,w,d) {
      const aa = Array.isArray(a) ? v3(...a) : a, bb = Array.isArray(b) ? v3(...b) : b;
      const dir=bb.clone().sub(aa), length=dir.length();
      tmpO.position.copy(aa).add(bb).multiplyScalar(.5);
      tmpO.quaternion.setFromUnitVectors(v3(0,1,0),dir.multiplyScalar(1/length));
      tmpO.scale.set(w,length,d); tmpO.updateMatrix();
      if(!this.groups.has(k)) this.groups.set(k,[]);
      this.groups.get(k).push(tmpO.matrix.clone());
      tmpO.rotation.set(0,0,0); tmpO.quaternion.identity();
    }
    flush(into) {
      for(const [key,matrixes] of this.groups){
        const im=new THREE.InstancedMesh(sharedBox,mat[key],matrixes.length);
        for(let i=0;i<matrixes.length;i++) im.setMatrixAt(i,matrixes[i]);
        im.instanceMatrix.needsUpdate=true;
        im.frustumCulled=false; im.name=`detail_${key}`;
        into.add(im);
      }
    }
  }
  const common = new BoxBatch(), fine = new BoxBatch(), minimal = new BoxBatch();
  function mesh(geometry,material,parent,x=0,y=0,z=0){
    const m=new THREE.Mesh(G(geometry), material);
    m.position.set(x,y,z);parent.add(m);return m;
  }
  function prismXZ(parent,points,y,depth,material,name=''){
    const shape=new THREE.Shape();shape.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length;i++) shape.lineTo(points[i][0],points[i][1]);
    shape.closePath();
    const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:1,steps:1});
    g.rotateX(PI/2);
    const m=mesh(g,material,parent,0,y,0); m.name=name;
    return m;
  }
  function rod(parent,a,b,r,material,sides=8){
    const aa=v3(...a),bb=v3(...b),d=bb.clone().sub(aa);
    const m=mesh(new THREE.CylinderGeometry(r,r,d.length(),sides),material,parent);
    m.position.copy(aa).add(bb).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(v3(0,1,0),d.normalize());
    return m;
  }
  function torus(parent,x,y,z,r,tube,material,rotX=0,rotY=0,arc=PI*2){
    const m=mesh(new THREE.TorusGeometry(r,tube,8,96,arc),material,parent,x,y,z);
    m.rotation.set(rotX,rotY,0);return m;
  }
  function taper(parent,x,y,z,rTop,rBottom,length,material,rotX=0,rotZ=0,sides=8){
    const m=mesh(new THREE.CylinderGeometry(rTop,rBottom,length,sides,1),material,parent,x,y,z);
    m.rotation.set(rotX,0,rotZ);return m;
  }
  function crystal(parent,x,y,z,r,material,detail=0){
    const m=mesh(new THREE.OctahedronGeometry(r,detail),material,parent,x,y,z);return m;
  }
  // Hull: non-boxed multi-chine naval silhouette, broad stern, armored tapered bow.
  const ringShape=[[-.67,0],[-.89,-4.4],[-1,-12],[-.93,-21],[-.66,-.76],[-.38,-.92],[0,-1],[.38,-.92],[.66,-.76],[.93,-21],[1,-12],[.89,-4.4],[.67,0]];
  function pointOnRing(s,i){
    const [z,w,t,b]=s; const p=ringShape[i];
    const x=p[0]*w;
    let y;
    if(i<=3 || i>=9) y=t+p[1];
    else y=b+(t-b)*(1+p[1])*.26;
    if(i===6)y=b;
    return [x,y,z];
  }
  const vertices=[], colors=[];
  function triangle(a,b,c,col){
    const color=new THREE.Color(col);
    for(const p of [a,b,c]){vertices.push(...p);colors.push(color.r,color.g,color.b);}
  }
  const cSets=[0x526578,0x314557,0x233547,0x1a2939,0x1c2b3b,0x152231,0x101d2a,
               0x152231,0x1c2b3b,0x233547,0x314557,0x526578,0x586b79];
  for(let j=0;j<segment.length-1;j++){
    for(let i=0;i<ringShape.length;i++){
      const k=(i+1)%ringShape.length;
      const a=pointOnRing(segment[j],i),b=pointOnRing(segment[j],k);
      const c=pointOnRing(segment[j+1],i),d=pointOnRing(segment[j+1],k);
      const tint=(j%3===0 ? 1.13 : j%3===1 ? .93:1);
      const color=new THREE.Color(cSets[i]).multiplyScalar(tint);
      triangle(a,c,b,color);triangle(b,c,d,color);
    }
  }
  // Front and stern armor closure
  const front=segment[0],rear=segment.at(-1);
  for(let i=0;i<ringShape.length;i++){
    const ni=(i+1)%ringShape.length;
    triangle([0,4,front[0]],pointOnRing(front,ni),pointOnRing(front,i),0x354657);
    triangle([0,3,rear[0]],pointOnRing(rear,i),pointOnRing(rear,ni),0x172534);
  }
  const hullGeo=G(new THREE.BufferGeometry());
  hullGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  hullGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  hullGeo.computeVertexNormals();
  const hull=new THREE.Mesh(hullGeo,mat.hullVertex);hull.name='ChineArmor_MainHull';base.add(hull);
  // Outlined bevel-like armor ribs follow the hull cross section.
  for(const s of segment.slice(1,-1)){
    for(let i=0;i<12;i++){
      if(i===5 || i===6 || i===7)continue;
      common.between('gold',pointOnRing(s,i),pointOnRing(s,i+1),.68,.64);
    }
  }
  for(let j=0;j<segment.length-1;j++){
    for(const i of [1,2,3,4,8,9,10,11]){
      common.between(i===2||i===10 ? 'gold':'gunmetal',pointOnRing(segment[j],i),pointOnRing(segment[j+1],i),.65,.75);
    }
  }
  // Deep keel and side vents.
  prismXZ(base,[[-7,-179],[7,-179],[16,-100],[18,87],[10,172],[-10,172],[-18,87],[-16,-100]],-36,11,mat.obsidian,'CentralKeel');
  for(const side of [-1,1]){
    const keelFin=prismXZ(base,[[side*12,-98],[side*23,-62],[side*34,101],[side*12,159]],-22,14,mat.gunmetal,'AetherBallastFin');
    for(let i=0;i<26;i++){
      const z=-127+i*11.2,ww=26+Math.sin((i/25)*PI)*27;
      common.matrix('gunmetal',side*(ww+.5),8,z,1.7,6.3,7.3);
      common.matrix('glow',side*(ww+1.45),6,z,1,1.4,4.2);
      if(i%2===0)fine.matrix('gold',side*(ww+1.4),11.6,z,1.6,.5,6);
    }
  }
  // Prow ram and central long-energy rail.
  prismXZ(base,[[-6,-205],[6,-205],[18,-174],[-18,-174]],14,7,mat.armor,'ProwBlade');
  common.matrix('glow',0,20.5,-168,1.6,1,69);
  common.matrix('gold',0,21.5,-170,4,.8,65);
  for(const s of [-1,1]){
    prismXZ(base,[[s*2,-197],[s*8,-192],[s*23,-163],[s*19,-153]],14,4,mat.gunmetal);
    common.between('glow',[s*8,18,-194],[s*24,20,-159],.8,.8);
  }
  // Continuous top promenade: designed for actual first/third-person traversal.
  prismXZ(base,[[-13,-135],[13,-135],[17,-111],[18,-69],[18,118],[15,143],[-15,143],[-18,118],[-18,-69],[-17,-111]],32,4.5,mat.obsidian,'Walkable_MainDeck');
  for(let z=-125;z<=132;z+=9.5){
    common.matrix('gunmetal',0,32.17,z,30,.12,.45);
    for(const side of [-1,1]){
      common.matrix('gold',side*15.0,32.35,z,1.15,.28,5.2);
      fine.matrix('glow',side*13.55,32.25,z,0.25,.16,5.7);
    }
  }
  // An exposed forward promenade with ornamental protective rails.
  for(const side of [-1,1]){
    for(let z=-129;z<=128;z+=9){
      common.matrix('gold',side*17.4,35.2,z,.9,6.2,1);
      if(z%3!==0)fine.matrix('armor',side*17.4,38.5,z,1.1,.5,1.25);
    }
    common.matrix('gold',side*17.4,38.2,0,1.1,1,260);
    common.matrix('glow',side*17.4,38.45,0,.23,.23,260);
  }
  // Angular outer deck shoulders and segmented plating.
  for(const side of [-1,1]){
    const s=side;
    prismXZ(base,[[s*19,-139],[s*30,-126],[s*43,-100],[s*55,-45],[s*56,94],[s*41,143],[s*19,130]],27,4,mat.armor,'Shoulder_Armor');
    for(let z=-108;z<=123;z+=16){
      const w=43+11*Math.max(0,Math.sin((z+100)/215*PI));
      fine.matrix('hull',s*(w-12),27.20,z,16,.36,12);
      fine.matrix('gold',s*(w-19),27.44,z,.65,.26,11);
      fine.matrix('gunmetal',s*(w-4),27.2,z,5,.6,8.2);
    }
  }
  // Main bridge: suspended control citadel leaves a full-height central walkway open below.
  for(const s of [-1,1]){
    common.matrix('gunmetal',s*23,39,-37,11,21,58);
    common.matrix('gold',s*24,47,-37,12,.9,60);
    for(let z=-58;z<=-17;z+=10){
      common.matrix('blackGlass',s*23,46,z,11.3,6.2,5.8);
      fine.matrix('glow',s*23,49.35,z,11.6,.5,4.7);
    }
  }
  prismXZ(base,[[-28,-75],[28,-75],[37,-53],[37,-17],[27,4],[-27,4],[-37,-17],[-37,-53]],61,16,mat.hull,'Bridge_MainCitadel');
  prismXZ(base,[[-27,-75],[27,-75],[31,-58],[31,-20],[22,-9],[-22,-9],[-31,-20],[-31,-58]],65,4,mat.armor,'Bridge_SlopedArmor');
  prismXZ(base,[[-23,-60],[23,-60],[26,-45],[26,-28],[-26,-28],[-26,-45]],75,9,mat.obsidian,'Bridge_Canopy');
  prismXZ(base,[[-17,-67],[17,-67],[22,-46],[22,-30],[-22,-30],[-22,-46]],80,6,mat.blackGlass,'ObservationGallery');
  prismXZ(base,[[-17,-59],[17,-59],[19,-38],[12,-27],[-12,-27],[-19,-38]],86,6,mat.gunmetal,'CrownRoof');
  common.matrix('armorLight',0,86,-45,35,2,32);
  for(const side of [-1,1]){
    for(let z=-66;z<=-20;z+=9.2){

renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';
renderer.domElement.style.touchAction='none';
renderer.domElement.tabIndex=0;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,.1,2400);
const hemi=new THREE.HemisphereLight(0xb0e8fa,0x152030,2.15);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffd9a9,3.1);key.position.set(-180,340,-240);scene.add(key);
const fill=new THREE.DirectionalLight(0x68d2ff,1.8);fill.position.set(180,70,220);scene.add(fill);
const rim=new THREE.DirectionalLight(0x99a6ff,1.0);rim.position.set(0,-80,180);scene.add(rim);
const vesselY=155;
const vessel=createAetherModule(THREE,{quality:mobile?'low':'high',position:[0,vesselY,0]});
scene.add(vessel.root);
// Scale reference: low contrast aerial transit city, far below the skyship.
const world=new THREE.Group();scene.add(world);
const platform=new THREE.Mesh(new THREE.CylinderGeometry(120,155,15,12),new THREE.MeshStandardMaterial({color:0x13283a,metalness:.7,roughness:.5}),);
platform.position.set(-290,10,-180);world.add(platform);
const cityBatch=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x29465a,metalness:.6,roughness:.55}),100);
const dummy=new THREE.Object3D();
for(let i=0;i<100;i++){
  const a=i*2.3999632,r=15+Math.sqrt(i/100)*112;
  const h=5+((i*37)%37);
  dummy.position.set(-290+Math.cos(a)*r,20+h/2,-180+Math.sin(a)*r);
  dummy.scale.set(4+((i*7)%9),h,4+((i*13)%10));dummy.rotation.y=a;dummy.updateMatrix();
  cityBatch.setMatrixAt(i,dummy.matrix);
}
cityBatch.instanceMatrix.needsUpdate=true;world.add(cityBatch);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),new THREE.MeshBasicMaterial({color:0x091826}));
ground.rotation.x=-Math.PI/2;ground.position.y=-8;world.add(ground);
const beaconMat=new THREE.MeshBasicMaterial({color:0x80d9ff});
for(const [x,z] of [[-290,-180],[360,-300],[-380,340]]){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,90,8),beaconMat);b.position.set(x,73,z);world.add(b);
  const t=new THREE.Mesh(new THREE.ConeGeometry(4,11,8),new THREE.MeshBasicMaterial({color:0xffba74}));t.position.set(x,123,z);world.add(t);
}
// Procedural airy cloud layers using one small generated texture.
const cloudCanvas=document.createElement('canvas');cloudCanvas.width=cloudCanvas.height=128;
const cctx=cloudCanvas.getContext('2d');const gradient=cctx.createRadialGradient(64,64,4,64,64,63);
gradient.addColorStop(0,'rgba(150,210,245,.28)');gradient.addColorStop(.38,'rgba(110,161,198,.14)');gradient.addColorStop(1,'rgba(100,140,190,0)');
cctx.fillStyle=gradient;cctx.fillRect(0,0,128,128);
const ct=new THREE.CanvasTexture(cloudCanvas);const clouds=[];
for(let i=0;i<28;i++){
  const a=i*2.39996,rad=260+(i%6)*95;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:ct,transparent:true,opacity:.35,depthWrite:false,color:0x99c2dc}));
  sprite.position.set(Math.cos(a)*rad,63+(i%5)*23,Math.sin(a)*rad);
  const size=180+(i%4)*65;sprite.scale.set(size,size*.46,1);world.add(sprite);clouds.push(sprite);
}
const player=new THREE.Group();vessel.root.add(player);
const pMat=new THREE.MeshStandardMaterial({color:0xd2c9a1,metalness:.72,roughness:.34});
const pArmor=new THREE.MeshStandardMaterial({color:0x27445c,metalness:.67,roughness:.37});
const pGlow=new THREE.MeshBasicMaterial({color:0x8bf2ff});
function pBox(w,h,d,x,y,z,material){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);player.add(m);return m;}
pBox(.72,1.05,.45,0,1.17,0,pArmor);pBox(.8,.17,.5,0,1.6,0,pMat);
pBox(.45,.47,.43,0,2.03,0,pMat);pBox(.41,.12,.08,0,2.07,-.25,pGlow);
for(const s of [-1,1]){pBox(.23,.82,.30,s*.56,1.2,0,pArmor);pBox(.25,.83,.30,s*.21,.48,0,pArmor);pBox(.2,.12,.15,s*.57,1.07,-.2,pGlow);}
player.visible=false;
const state={mode:'orbit',quality:mobile?'low':'high',fps:false,auto:false,door:true,orbitYaw:.72,orbitPitch:.31,dist:540,target:new THREE.Vector3(0,190,0),
px:0,pz:-112,py:32.18,moveYaw:0,movePitch:0,vy:0,jump:0,joystickX:0,joystickY:0};
const keys=new Set();let lastTime=performance.now(),frames=0,fpsTime=lastTime;
function setQuality(q){state.quality=vessel.setQuality(q);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,q==='high'?(mobile?1.5:1.75):1.05));renderer.setSize(innerWidth,innerHeight,false);
  clouds.forEach((s,i)=>s.visible=q==='high'||i<12);
  $('#btnLow').classList.toggle('active',q==='low');$('#btnHigh').classList.toggle('active',q==='high');
  $('#detailQuality').textContent=q==='high'?'HIGH DETAIL':'LITE DETAIL';}
setQuality(state.quality);
function setMode(m){state.mode=m;document.body.classList.toggle('explore',m==='explore');$('#btnOrbit').classList.toggle('active',m==='orbit');$('#btnExplore').classList.toggle('active',m==='explore');
  player.visible=m==='explore'&&!state.fps;
  $('#crosshair').style.display=(m==='explore'&&state.fps)?'block':'none';
  $('#hint').innerHTML=m==='orbit'?'ドラッグ：機体を回転 ／ ホイール・ピンチ：拡大縮小<br>甲板探索に切り替えると、実際に艦内を移動できる':'WASD：移動 ／ ドラッグ：視点 ／ V：FPS/TPS ／ Space：ジャンプ<br>スマホ：左スティック移動、画面右半分ドラッグで視点';
  if(m==='explore'){state.px=0;state.pz=-111;state.py=32.18;state.moveYaw=0;state.movePitch=0;state.vy=0;state.jump=0;}
}
$('#btnOrbit').onclick=()=>setMode('orbit');$('#btnExplore').onclick=()=>setMode('explore');
$('#btnLow').onclick=()=>setQuality('low');$('#btnHigh').onclick=()=>setQuality('high');
$('#btnPulse').onclick=()=>vessel.triggerPulse();
$('#btnDoor').onclick=()=>{state.door=!state.door;vessel.setHangarOpen(state.door);$('#btnDoor').textContent=`▤ 格納庫ゲート：${state.door?'開':'閉'}`;};
$('#btnAuto').onclick=()=>{state.auto=!state.auto;$('#btnAuto').textContent=`↻ 自動回転：${state.auto?'入':'切'}`;$('#btnAuto').classList.toggle('active',state.auto);};
function changeFPS(){state.fps=!state.fps;player.visible=state.mode==='explore'&&!state.fps;$('#crosshair').style.display=state.fps&&state.mode==='explore'?'block':'none';}
$('#btnCamera').onclick=changeFPS;
function teleportHangar(){setMode('explore');state.px=62;state.pz=74;state.py=27.18;state.moveYaw=-Math.PI/2;}
$('#btnHangar').onclick=teleportHangar;$('#btnReturn').onclick=()=>setMode('orbit');
$('#btnJump').onclick=()=>{if(state.jump<.08){state.vy=5.0;state.jump=.02;}};
const preset={front:[3.14159,0.20,510,0,180,-60],side:[1.55,.17,485,0,180,0],top:[.6,1.24,415,0,183,0],rear:[0,.18,460,0,175,60],ring:[.55,.18,190,0,254,48],hangar:[1.25,.22,195,71,197,70]};
for(const b of document.querySelectorAll('[data-preset]')) b.addEventListener('click',()=>{
  const p=preset[b.dataset.preset];setMode('orbit');state.auto=false;$('#btnAuto').textContent='↻ 自動回転：切';$('#btnAuto').classList.remove('active');
  state.orbitYaw=p[0];state.orbitPitch=p[1];state.dist=p[2];state.target.set(p[3],p[4],p[5]);
});
window.addEventListener('keydown',e=>{keys.add(e.code);
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 if(e.code==='KeyV'&&state.mode==='explore')changeFPS();
 if(e.code==='Space'&&state.mode==='explore'&&state.jump<.08){state.vy=5.0;state.jump=.02;}
 if(e.code==='KeyH')teleportHangar();
 if(e.code==='Escape'&&state.mode==='explore')setMode('orbit');
});
window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
let dragId=null, lastX=0,lastY=0,pinchDistance=null;
const pointers=new Map();
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragId=e.pointerId;lastX=e.clientX;lastY=e.clientY;});
cvs.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&state.mode==='orbit'){
    const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchDistance!==null)state.dist=THREE.MathUtils.clamp(state.dist*pinchDistance/d,85,950);
    pinchDistance=d;lastX=e.clientX;lastY=e.clientY;return;
  }
  if(dragId!==e.pointerId)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  if(state.mode==='orbit'){
    state.orbitYaw-=dx*.0055;state.orbitPitch=THREE.MathUtils.clamp(state.orbitPitch+dy*.0045,-1.18,1.42);
  } else {
    state.moveYaw-=dx*.0039;state.movePitch=THREE.MathUtils.clamp(state.movePitch-dy*.0033,-.8,.85);
  }
});
function clearPointer(e){pointers.delete(e.pointerId);if(dragId===e.pointerId)dragId=null;if(pointers.size<2)pinchDistance=null;}
cvs.addEventListener('pointerup',clearPointer);cvs.addEventListener('pointercancel',clearPointer);
cvs.addEventListener('wheel',e=>{if(state.mode==='orbit'){state.dist=THREE.MathUtils.clamp(state.dist*Math.exp(e.deltaY*.00085),85,950);e.preventDefault();}},{passive:false});
// Touchpad is isolated from the orbit/look pointer surface.
const joy=$('#joystick'),knob=$('#knob');let joyPointer=null;
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoy(e);});
function updateJoy(e){const r=joy.getBoundingClientRect();const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);const a=Math.atan2(y,x),d=Math.min(39,Math.hypot(x,y));
 state.joystickX=Math.cos(a)*d/39;state.joystickY=Math.sin(a)*d/39;knob.style.transform=`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;}
function resetJoy(e){if(joyPointer===e.pointerId){joyPointer=null;state.joystickX=state.joystickY=0;knob.style.transform='';}}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
const clock=new THREE.Clock();let total=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.06,clock.getDelta());total+=dt;
  vessel.update(dt,{elapsedTime:total,quality:state.quality});
  if(state.mode==='orbit'){
    if(state.auto)state.orbitYaw+=dt*.085;
    const cp=Math.cos(state.orbitPitch),sp=Math.sin(state.orbitPitch);
    camera.position.set(state.target.x+Math.sin(state.orbitYaw)*state.dist*cp,state.target.y+sp*state.dist,state.target.z+Math.cos(state.orbitYaw)*state.dist*cp);
    camera.lookAt(state.target);
  } else {
    const forwards=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-state.joystickY;
    const sideways=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+state.joystickX;
    const mag=Math.max(1,Math.hypot(forwards,sideways));const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight')?12:7.5)*dt/mag;
    const sn=Math.sin(state.moveYaw),cs=Math.cos(state.moveYaw);
    const vx=(-sn*forwards+cs*sideways)*speed, vz=(-cs*forwards-sn*sideways)*speed;
    const nx=state.px+vx,nz=state.pz+vz;
    let surface=vessel.sampleWalkable(nx,nz,state.py);
    if(surface!==null){state.px=nx;state.pz=nz;state.py=surface;}
    else if(Math.abs(vx)>Math.abs(vz)){
      surface=vessel.sampleWalkable(state.px,nz,state.py);
      if(surface!==null){state.pz=nz;state.py=surface;}
    } else {
      surface=vessel.sampleWalkable(nx,state.pz,state.py);
      if(surface!==null){state.px=nx;state.py=surface;}
    }
    if(state.jump>.001||state.vy>0){state.jump+=state.vy*dt;state.vy-=13*dt;if(state.jump<=0){state.jump=0;state.vy=0;}}
    const fwd=new THREE.Vector3(-sn,0,-cs);
    player.position.set(state.px,state.py+state.jump,state.pz);
    player.rotation.y=state.moveYaw;
    const pHeight=vesselY+state.py+state.jump;
    if(state.fps){
      camera.position.set(state.px,pHeight+2.05,state.pz);
      camera.lookAt(state.px+fwd.x*25,pHeight+2.05+Math.tan(state.movePitch)*25,state.pz+fwd.z*25);
    }else{
      camera.position.set(state.px-fwd.x*11,pHeight+6.4+state.movePitch*4,state.pz-fwd.z*11);
      camera.lookAt(state.px+fwd.x*7,pHeight+2.1+state.movePitch*7,state.pz+fwd.z*7);
    }
  }
  renderer.render(scene,camera);
  frames++;
  if(now-fpsTime>750){const fps=(frames*1000/(now-fpsTime)).toFixed(0);$('#fps').textContent=fps+' FPS';frames=0;fpsTime=now;}
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);});
renderer.setAnimationLoop(null);
requestAnimationFrame(animate);
window.__AF09={vessel,scene,camera,renderer,setMode,setQuality,teleportHangar,state};
</script>
