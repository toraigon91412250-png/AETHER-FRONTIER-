<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No.18 External-Module Integration Smoke Test</title>
<style>
html,body{margin:0;background:#08192b;color:white;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#menu{position:fixed;left:16px;top:16px;padding:15px;background:#0b1824cb;border:1px solid #78a3b85a;border-radius:8px;line-height:2;backdrop-filter:blur(8px)}
button{background:#203f55;color:white;border:1px solid #7bb9cf;border-radius:4px;padding:8px;cursor:pointer}
</style></head><body>
<div id="menu">No.18 統合API動作確認<br><button id="time">時刻を進める</button> <button id="weather">天候を変える</button> <button id="quality">画質を変更</button><br><span id="info">Loading...</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { createAetherModule } from './aether-atmosphere.js';
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,3200);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
camera.position.set(0,18,110);camera.lookAt(0,10,-300);
const sky=createAetherModule(THREE,{quality:'lite',cloudSeaLevel:-80,timeOfDay:17.5,weather:'clear'});
scene.add(sky.root);
// Scene-owned geometry for a visibility and depth-test reference.
const mat=new THREE.MeshBasicMaterial({color:0x263d53});
const tower=new THREE.Mesh(new THREE.CylinderGeometry(3,9,75,7),mat);
tower.position.set(0,25,-135);scene.add(tower);
let h=17.5,whichWeather=0,q='lite';const weather=['clear','cloudy','rain','storm','mist','aurora'];
document.getElementById('time').onclick=()=>{h=(h+3)%24;sky.setTimeOfDay(h);};
document.getElementById('weather').onclick=()=>{whichWeather=(whichWeather+1)%weather.length;sky.setWeather(weather[whichWeather],0.8);};
document.getElementById('quality').onclick=()=>{q=q==='lite'?'high':'lite';sky.setQuality(q);};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
let previous=performance.now(),lastInfo=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-previous)/1000,.1);previous=now;
 sky.update(dt,{camera});renderer.render(scene,camera);
 if(now-lastInfo>300){const s=sky.getState();document.getElementById('info').textContent=`時刻 ${s.timeOfDay.toFixed(1)}時 / ${s.weather} / ${s.quality}`;lastInfo=now;}
}
requestAnimationFrame(frame);
// When tearing down a scene: scene.remove(sky.root); sky.dispose();
</script></body></html>
